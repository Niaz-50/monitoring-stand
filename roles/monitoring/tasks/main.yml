---
- name: Create Prometheus volume
  community.docker.docker_volume:
    name: prometheus_data

- name: Create Grafana volume
  community.docker.docker_volume:
    name: grafana_data

- name: Create Prometheus config directory
  ansible.builtin.file:
    path: /etc/prometheus
    state: directory
    mode: '0755'

- name: Copy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml

- name: Run Prometheus container
  community.docker.docker_container:
    name: prometheus
    image: prom/prometheus:latest
    state: started
    restart_policy: always
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - /etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

- name: Run Grafana container
  community.docker.docker_container:
    name: grafana
    image: grafana/grafana:latest
    state: started
    restart_policy: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

- name: Run Postgres Exporter
  community.docker.docker_container:
    name: postgres_exporter
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    state: started
    restart_policy: always
    ports:
      - "9187:9187"
    env:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@host.docker.internal:5433/postgres?sslmode=disable"

- name: Run Redis Exporter
  community.docker.docker_container:
    name: redis_exporter
    image: oliver006/redis_exporter:latest
    state: started
    restart_policy: always
    ports:
      - "9121:9121"
    command:
      - '--redis.addr=redis://host.docker.internal:6385'